# Builds one arm64 image, scans it with Trivy (a fixable CRITICAL stops it
# before the push), pushes it to registry.smdoes.eu and signs it with
# cosign (keyless, GitHub OIDC). Called by
# images.yml here and by smega/cluster-dashboard.
#
# Tag: main-<unix time>-<short sha>. The time makes tags sortable, so
# Flux's ImagePolicy can pick the newest (clusters/home/image-automation);
# the sha says which commit it is. No :latest: a tag is never moved, so
# every pod runs exactly the build git says.
#
# Actions are pinned to commit SHAs (tag in the comment): a moved tag
# can't swap the code that gets the registry password. Renovate bumps them.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Name under registry.smdoes.eu/raspberry/
        required: true
        type: string
      context:
        description: Docker build context (directory with the Dockerfile)
        required: true
        type: string
      runner:
        description: Runner label; arm64 hosted runners are free for public repos only
        required: false
        type: string
        default: ubuntu-24.04-arm
      build-status-web-args:
        description: Bake the commit into the page (status-web's "Last deploy" line)
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write          # cosign keyless signing
  security-events: write   # Trivy results in the Security tab

env:
  REGISTRY: registry.smdoes.eu
  REPO: registry.smdoes.eu/raspberry/${{ inputs.image }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only on an x64 runner (a private repo's): arm64 builds via QEMU.
      - if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Tag
        id: tag
        run: |
          {
            echo "tag=main-$(date -u +%s)-${GITHUB_SHA::7}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'message<<EOF'
            git log -1 --format=%s
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build into an OCI layout directory first: the scan below reads it,
      # and the push uploads exactly those bytes, so the digest that gets
      # deployed is the one that was scanned. Anything pushed would be
      # deployed by Flux, so the gate has to come before the push.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/arm64
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false
          tags: ${{ env.REPO }}:${{ steps.tag.outputs.tag }}
          build-args: |
            ${{ inputs.build-status-web-args && format('VITE_BUILD_SHA={0}', github.sha) || '' }}
            ${{ inputs.build-status-web-args && format('VITE_BUILD_TIME={0}', steps.tag.outputs.time) || '' }}
            ${{ inputs.build-status-web-args && format('VITE_BUILD_MESSAGE={0}', steps.tag.outputs.message) || '' }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      # The gate: a CRITICAL vulnerability that has a fix fails the build.
      - name: Scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # skopeo reads the login from ~/.docker/config.json (login-action).
      - name: Push
        id: push
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo copy --quiet --digestfile "$RUNNER_TEMP/digest" \
            "oci:$RUNNER_TEMP/image" "docker://${REPO}:${{ steps.tag.outputs.tag }}"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by this workflow file on main, whichever repo called it; the
      # cluster checks for exactly this identity (kyverno/).
      #
      # Legacy signature format (a .sig tag), not cosign v3's default
      # bundle-as-OCI-referrer: the cluster's policy-controller (0.13) only
      # finds the former ("no signatures found" otherwise).
      - name: Sign and verify
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${REPO}@${{ steps.push.outputs.digest }}"
          cosign verify "${REPO}@${{ steps.push.outputs.digest }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/smega/raspberry-k3s/.github/workflows/build-image.yml@refs/heads/main \
            > /dev/null

      # Full report (CRITICAL to LOW) for the Security tab, fixable ones
      # only: unfixed distro CVEs (util-linux on Debian...) can't be acted
      # on and only bury the ones that can.
      - name: Scan (report)
        if: always() && steps.push.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          image-ref: ${{ env.REPO }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.image }}

      - name: Summary
        run: |
          {
            echo "### ${{ inputs.image }}"
            echo
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- no fixable CRITICAL vulnerability (Trivy), signed and verified (cosign keyless)"
          } >> "$GITHUB_STEP_SUMMARY"
