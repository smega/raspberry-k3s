# Runs the canary checks (webhooks in the Canary objects): curl and jq
# against the canary Service, inside the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loadtester
  namespace: flagger-system
spec:
  releaseName: loadtester
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: loadtester
      version: 0.39.0
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: loadtester-values
      valuesKey: values.yaml
