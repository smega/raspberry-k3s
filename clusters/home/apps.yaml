# Status page, whoami, the read-only dashboard, the Gateway and routes,
# and the SLO / certificate alert rules.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./deployments
  prune: false
  timeout: 10m
  dependsOn:
    - name: monitoring  # ServiceMonitor/Probe/PrometheusRule CRDs, blackbox
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pi-temp-led
  namespace: flux-system
spec:
  interval: 30m
  path: ./pi-temp-led/deployments
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
