apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flagger
  namespace: flux-system
spec:
  # After monitoring: the PodMonitor/PrometheusRule CRDs, and Prometheus
  # is what the canary metrics are asked from.
  dependsOn:
    - name: monitoring
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./flagger
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
