apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-controller
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./policy-controller
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: policy-controller
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./image-policies
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
