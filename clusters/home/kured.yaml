apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kured
  namespace: flux-system
spec:
  # After monitoring (it asks Prometheus for firing alerts) and kong
  # (the replicas/PDBs that make a drain safe).
  dependsOn:
    - name: monitoring
    - name: kong
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./kured
  prune: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
