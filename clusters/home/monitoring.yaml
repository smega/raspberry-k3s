apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  path: ./monitoring
  # Not pruning yet: these objects existed before Flux; switch on once the
  # adoption has been watched for a while.
  prune: false
  timeout: 25m
  sourceRef:
    kind: GitRepository
    name: flux-system
