# Daily vulnerability rescans of every running image ( trivy-operator/ ).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring  # the ServiceMonitor CRD
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./trivy-operator
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
