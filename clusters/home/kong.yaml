apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kong
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./kong
  # Not pruning: Kong was installed before Flux (see monitoring.yaml).
  prune: false
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
