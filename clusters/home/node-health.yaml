apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-health
  namespace: flux-system
spec:
  # After monitoring: the PodMonitor and PrometheusRule need its CRDs.
  dependsOn:
    - name: monitoring
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./node-health
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
