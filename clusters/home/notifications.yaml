# Flux reconciliation failures (a Kustomization that doesn't apply, a Helm
# upgrade that fails, a repo that can't be fetched) go to the same ntfy
# topic as the Prometheus alerts. The topic URL is the Secret
# flux-system/ntfy-flux (key `address`, created by hand), with ntfy's
# message templating in the query string:
#   https://ntfy.sh/<topic>?tpl=1&t=Flux: {{.involvedObject.kind}}/{{.involvedObject.name}} {{.reason}}&m={{.message}}&priority=high
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: ntfy
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: ntfy-flux
---
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: reconcile-failures
  namespace: flux-system
spec:
  providerRef:
    name: ntfy
  eventSeverity: error
  # The home line drops for ~20 s at 04:00 every night. On 2026-11-26 the
  # in-cluster resolver failed for one second and all 8 ImageRepositories
  # sent a "server misbehaving" each; they were fine 5 minutes later. Only
  # DNS resolver failures are dropped: a DNS outage that lasts is caught by
  # the status checker and the external probe, and every other error
  # ( bad manifest, missing tag, auth ) still comes through.
  exclusionList:
    - 'dial tcp: lookup \S+ on \S+: (server misbehaving|i/o timeout)'
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
    - kind: HelmRelease
      name: '*'
      namespace: monitoring
    - kind: HelmRelease
      name: '*'
      namespace: kong
    - kind: HelmRelease
      name: '*'
      namespace: kube-system
    - kind: HelmRepository
      name: '*'
    # CI -> deploy: a registry Flux can't read, or new tags it can't
    # commit back to git (image-automation/).
    - kind: ImageRepository
      name: '*'
    - kind: ImageUpdateAutomation
      name: '*'
