# The private half (smega/raspberry-k3s-private): probes with private
# hostnames/IPs. Read with a read-only deploy key kept in
# the Secret flux-system/raspberry-k3s-private (created by hand).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: raspberry-k3s-private
  namespace: flux-system
spec:
  interval: 5m
  url: ssh://git@github.com/smega/raspberry-k3s-private
  ref:
    branch: main
  secretRef:
    name: raspberry-k3s-private
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./
  prune: false
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: raspberry-k3s-private
---
# The hand-made Secrets, SOPS-encrypted in the private repo's secrets/.
# Decrypted with the age key in flux-system/sops-age (created by hand, the
# one Secret besides the deploy key above that can't come from git).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m  # a failed apply retries soon, not after 30m
  path: ./secrets
  prune: false
  sourceRef:
    kind: GitRepository
    name: raspberry-k3s-private
  decryption:
    provider: sops
    secretRef:
      name: sops-age
