# Next to the signature (raspberry-images.yaml), every
# registry.smdoes.eu/raspberry/** image in a watched namespace must carry
# two attestations from the same CI identity (build-image.yml):
# - an SBOM (SPDX JSON, syft), so "what's in that image" has an answer
#   for any digest that is running;
# - SLSA v1 provenance whose builder is that workflow on main, so an image
#   built anywhere else (or by hand) and then signed would still fail.
# Both are written by the build job itself (SLSA Build L2, not L3).
#
# mode: enforce since 2026-11-19, after warn mode and a server-side dry-run
# of every running image passed (and an image from before the
# attestations got "no matching attestations"). An image built before
# 2026-11-19 14:30 UTC can't be rolled back to any more; rebuild it.
apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: raspberry-attestations
spec:
  mode: enforce
  images:
    - glob: "registry.smdoes.eu/raspberry/**"
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/smega/raspberry-k3s/.github/workflows/build-image.yml@refs/heads/main
      ctlog:
        url: https://rekor.sigstore.dev
      attestations:
        - name: sbom
          predicateType: https://spdx.dev/Document
        - name: provenance
          predicateType: https://slsa.dev/provenance/v1
          policy:
            type: cue
            data: |
              predicateType: "https://slsa.dev/provenance/v1"
              predicate: runDetails: builder: id: "https://github.com/smega/raspberry-k3s/.github/workflows/build-image.yml@refs/heads/main"
