# Sigstore policy-controller, applied by Flux (clusters/home/policy-controller.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policy-controller.yaml
configMapGenerator:
  - name: policy-controller-values
    namespace: cosign-system
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
