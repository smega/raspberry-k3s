# Sigstore policy-controller: an admission webhook that checks image
# signatures against the ClusterImagePolicies in image-policies/. Only for
# namespaces labelled policy.sigstore.dev/include=true (the public apps).
webhook:
  # Two, on different nodes: the chart's PDB (minAvailable 1) would block
  # every drain (kured, k3s upgrades) with a single replica.
  replicaCount: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                control-plane: policy-controller-webhook
  # Ignore, not Fail: if the webhook is down (a node crash), pods in the
  # watched namespaces must still start; the policies' mode decides what a
  # failed check does while it's up.
  failurePolicy: Ignore
  configData:
    # Images no policy covers (traefik/whoami, ...) are fine; only
    # registry.smdoes.eu/raspberry/** has to be signed.
    no-match-policy: allow
  # Measured 2026-11-21: up to 219Mi ( 85% of the old 256Mi limit ), ~47m
  # CPU at p95, throttled at the old 200m limit.
  resources:
    requests:
      cpu: 50m
      memory: 224Mi
    limits:
      cpu: 300m
      memory: 384Mi
