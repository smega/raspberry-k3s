# The image's default server, plus /content/: text mounted from the
# status-content ConfigMap at runtime (see content/README.md). It changes
# without a new image, so caches must ask again every time; nginx still
# answers 304 when the file hasn't changed.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        index index.html;
    }

    location /content/ {
        add_header Cache-Control "no-cache" always;
    }

    error_page 500 502 503 504 /50x.html;
}
