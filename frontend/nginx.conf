# The image's default server, plus /content/: text mounted from the
# status-content ConfigMap at runtime (see content/README.md). It changes
# without a new image, so caches must ask again every time; nginx still
# answers 304 when the file hasn't changed.

# Errors are never cached: during a canary release a visitor can get the
# new index.html from one version and ask the other for its assets, and a
# 404 for a file the other version doesn't have must not stick at
# Cloudflare ( it kept one for 4 hours on 2026-11-21 ).
map $status $error_no_store {
    ~^[45]  "no-store";
    default "";
}
map $status $content_cache {
    ~^[45]  "no-store";
    default "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    # An empty value sends no header, so successful responses are as before.
    add_header Cache-Control $error_no_store always;

    location / {
        index index.html;
    }

    location /content/ {
        add_header Cache-Control $content_cache always;
    }

    error_page 500 502 503 504 /50x.html;
}
