# Values for the `blackbox` release (prometheus-blackbox-exporter), used for
# TLS certificate expiry probes (deployments/12-cert-expiry.yaml) and the
# DNS probes (monitoring/dns-probe.yaml). Applied by
# Flux via monitoring/blackbox.yaml.
#
# Probes are Probe objects (prometheus-operator), not chart-managed
# ServiceMonitors, so targets live next to the alert rules.
config:
  modules:
    # TLS handshake with full verification: fails on an expired, wrong-name
    # or untrusted certificate, and reports probe_ssl_earliest_cert_expiry.
    tls_connect:
      prober: tcp
      timeout: 10s
      tcp:
        tls: true
        preferred_ip_protocol: ip4
    # Same, for certificates signed by a private CA (k3s's own): verification
    # skipped, but the expiry date is still reported.
    tls_connect_insecure:
      prober: tcp
      timeout: 10s
      tcp:
        tls: true
        preferred_ip_protocol: ip4
        tls_config:
          insecure_skip_verify: true
    # SMTP submission: STARTTLS, then the certificate is checked like above.
    smtp_starttls:
      prober: tcp
      timeout: 15s
      tcp:
        preferred_ip_protocol: ip4
        query_response:
          - expect: "^220 "
          - send: "EHLO probe.local\r"
          - expect: "^250 "
          - send: "STARTTLS\r"
          - expect: "^220 "
          - starttls: true
          - send: "QUIT\r"
    # DNS as every pod sees it ( monitoring/dns-probe.yaml ): a cluster
    # name, and an outside name that CoreDNS forwards upstream.
    dns_cluster:
      prober: dns
      timeout: 3s
      dns:
        query_name: kubernetes.default.svc.cluster.local
        query_type: A
        transport_protocol: udp
        preferred_ip_protocol: ip4
        valid_rcodes: [NOERROR]
    dns_external:
      prober: dns
      timeout: 3s
      dns:
        query_name: github.com
        query_type: A
        transport_protocol: udp
        preferred_ip_protocol: ip4
        valid_rcodes: [NOERROR]

serviceMonitor:
  enabled: false

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
