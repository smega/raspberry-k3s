# Values for the `grafana` Helm release (kube-prometheus-stack, namespace
# monitoring). Applied by Flux: monitoring/kube-prometheus-stack.yaml turns
# this file into a ConfigMap the HelmRelease reads, so a commit here is a
# helm upgrade. The chart version lives in that HelmRelease.
#
# Needs these Secrets in monitoring first (created by hand, never in git):
#   alertmanager-notify - ntfy/RunGuard webhook URLs (see below)
#   grafana-admin       - admin-user / admin-password
# The HelmRelease skips CRDs; on a chart bump that changes the operator
# version, apply the new CRDs first:
#   helm show crds prometheus-community/kube-prometheus-stack --version X \
#     | kubectl apply --server-side --force-conflicts -f -

# k3s runs the scheduler, controller-manager and kube-proxy inside the one
# k3s process and doesn't expose them as separate scrape targets, and the
# datastore is not a standalone etcd. These only produced permanently firing
# critical *Down alerts.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# No nginx ingress controller any more (Kong replaced it). Grafana is on the
# Tailscale NodePort, Prometheus/Alertmanager via port-forward.
grafana:
  ingress:
    enabled: false
  # Admin login from a Secret instead of a plain-text value (the old value
  # leaked into a session log on 2026-11-13 and was rotated with this).
  admin:
    existingSecret: grafana-admin
  # Requests from measured usage ( 2026-11-21: CPU p95 over 36 h, memory
  # 7-day peak + ~15% ). Before this, the stack's pods had none, so the
  # scheduler counted kube-master as nearly empty. Grafana peaked at 635Mi.
  resources:
    requests:
      cpu: 40m
      memory: 448Mi
    limits:
      memory: 896Mi
  sidecar:
    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        memory: 192Mi
    # The Prometheus datasource the chart provisions: an exemplar's
    # trace_id ( status-api's request durations, backend/requestmetrics.go )
    # opens that trace in Tempo.
    datasources:
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  # Dashboards/users live in SQLite on this PVC (local-path, 20Gi).
  persistence:
    enabled: true
    accessModes: [ReadWriteOnce]
    size: 20Gi
    finalizers: [kubernetes.io/pvc-protection]
  # Reached over Tailscale at http://kube-master:31296.
  service:
    type: NodePort
    nodePort: 31296
  # Logs and traces (observability/). A log line's trace_id (structured
  # metadata, set by Alloy) links to the trace; a trace links back to the
  # lines that carry its id, 5 minutes either side. $$ keeps Grafana's
  # provisioning from reading ${...} as an environment variable.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.observability.svc:3100
      jsonData:
        derivedFields:
          - name: trace
            matcherType: label
            matcherRegex: trace_id
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: Trace
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.observability.svc:3200
      jsonData:
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          customQuery: true
          # Both traced apps (status-api, the checker) run in public-demo.
          query: '{namespace="public-demo"} | trace_id="$${__trace.traceId}"'
# k3s runs the API server inside the same process as kube-master's
# kubelet, so the kubelet's /metrics also carries every apiserver_* and
# etcd_* histogram: about 55k series (of 207k) that the apiserver job
# already scrapes, with no rule or dashboard reading them from here. On a
# 4 GB control plane that's Prometheus memory for nothing (2026-11-19).
# The chart's own default drop is kept above them.
kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd)_.*
prometheus:
  ingress:
    enabled: false
  prometheusSpec:
    # Exemplars: a sample trace id per histogram bucket, kept in memory
    # ( 100k by default, a few MB ). Only status-api's request durations
    # carry them.
    enableFeatures: [exemplar-storage]
    # TSDB on the USB stick in kube-master (prometheus-storage/), so a
    # restart no longer wipes the history. 30d covers the SLO window; the
    # size cap leaves headroom on the 57 GB stick (PV is 50Gi).
    retention: 30d
    retentionSize: 40GB
    # Measured: ~120m CPU at p95, up to 1254Mi. A request only: a memory
    # limit would OOM-kill it into a WAL replay and a gap in every chart.
    resources:
      requests:
        cpu: 150m
        memory: 1200Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: prometheus-usb
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

alertmanager:
  ingress:
    enabled: false
  alertmanagerSpec:
    # Don't go below v0.28: 0.27.0 panics when a webhook configured with
    # url_file gets a 4xx back and crash-loops (hit 2026-11-14, when ntfy
    # rejected an oversized message). The chart's default is newer now.
    #
    # Silences and the notification log on disk: on an emptyDir, every
    # Alertmanager restart forgot what it had already sent (the 2026-11-14
    # crash loop re-sent the same alerts each time) and dropped all silences.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    # Two replicas on different nodes. With one, a crashed worker took all
    # alerting with it: its local-path volume pins the pod to that node, and
    # a StatefulSet doesn't replace a pod on an unreachable node anyway
    # (node-crash game day 2026-11-20: only the RunGuard watchdog noticed).
    # The two gossip, so a notification still goes out once and silences
    # are shared.
    replicas: 2
    podAntiAffinity: hard
    # Measured: up to 53Mi; the operator's default request was 200Mi each.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    # Secret alertmanager-notify (created by hand, never in git), mounted at
    # /etc/alertmanager/secrets/alertmanager-notify/:
    #   ntfy-critical-url     - https://ntfy.sh/<topic>?template=yes&title=...&message=...&priority=high&tags=rotating_light
    #   ntfy-warning-url      - https://ntfy.sh/<topic>?template=yes&title=...&message=...&tags=warning
    #   ntfy-info-url         - the same with &tags=rocket&priority=low ( NewVersionLive )
    # title/message are an inline ntfy template (URL-encoded) over the webhook
    # JSON; ntfy's built-in "alertmanager" one doesn't show runbook_url:
    #   title:   {{- if eq .status "resolved" }}Resolved: {{ end }}{{ (first .alerts).labels.alertname }}
    #   message: per alert, the summary, the description and "Runbook: <url>";
    #            a resolved alert is one line
    #   runguard-watchdog-url - https://runguard.smega.eu/hb/<key> of the
    #                           "alertmanager watchdog" RunGuard job
    # The ntfy topic name is the only access control on ntfy.sh, so it is a
    # long random string and lives only in this Secret.
    secrets:
      - alertmanager-notify
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace, service, slug]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Dead man's switch: Watchdog always fires, so RunGuard (on the manage
        # VPS, outside the cluster) gets a ping every ~5 min while
        # Prometheus -> Alertmanager works end to end. When the pings stop,
        # RunGuard alerts on ntfy.
        - matchers: [alertname = "Watchdog"]
          receiver: runguard
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        - matchers: [alertname = "InfoInhibitor"]
          receiver: "null"
        # Only an inhibition source (maintenance-rules.yaml), never sent.
        - matchers: [alertname = "NodeMaintenance"]
          receiver: "null"
        # A new version went live ( flagger/alerts.yaml ): one quiet message
        # per release, api and web together when they go out at once.
        - matchers: [alertname = "NewVersionLive"]
          receiver: ntfy-info
          group_by: [alertname]
          group_wait: 1m
          repeat_interval: 24h
        - matchers: [severity = "critical"]
          receiver: ntfy-critical
          repeat_interval: 4h
        - matchers: [severity = "warning"]
          receiver: ntfy-warning
          repeat_interval: 24h
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
      - source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
        equal: [namespace]
      - target_matchers: [alertname = InfoInhibitor]
      # While any node is cordoned for maintenance (maintenance-rules.yaml),
      # the alerts a drain and a reboot are expected to cause stay quiet,
      # on every node: a drained pod's replacement starts elsewhere, and
      # Alertmanager's own pod (local volume) is down with its node. The
      # status SLOs, certificates and canaries are not in the list.
      - source_matchers: [alertname = NodeMaintenance]
        target_matchers:
          - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|KubeletDown|KubeletInstanceUnreachable|TargetDown|KubePodNotReady|KubeContainerWaiting|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeStatefulSetReplicasMismatch|KubeDaemonSetRolloutStuck|KubeDaemonSetNotScheduled|KubeDaemonSetMisScheduled|KubePdbNotEnoughHealthyPods|KubeHpaReplicasMismatch|PrometheusNotConnectedToAlertmanagers|PrometheusErrorSendingAlertsToSomeAlertmanagers"
    receivers:
      - name: "null"
      # ntfy.sh renders Alertmanager's webhook JSON itself (inline template, above).
      # Each ntfy receiver also posts to alert-diagnostics (alert-diagnostics.yaml),
      # which follows up with a quiet message of context. Separate webhooks:
      # if it is down, the alert above still goes out.
      - name: ntfy-critical
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-critical-url
            send_resolved: true
            # ntfy rejects a templated message over 4 KB (HTTP 400).
            max_alerts: 3
          - url: http://alert-diagnostics.monitoring.svc/alert
            send_resolved: false
            max_alerts: 3
      - name: ntfy-warning
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-warning-url
            send_resolved: true
            max_alerts: 3
          - url: http://alert-diagnostics.monitoring.svc/alert
            send_resolved: false
            max_alerts: 3
      # No alert-diagnostics here: nothing to diagnose.
      - name: ntfy-info
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/ntfy-info-url
            send_resolved: false
            max_alerts: 3
      - name: runguard
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-notify/runguard-watchdog-url
            send_resolved: false
    templates:
      - /etc/alertmanager/config/*.tmpl

# Measured 2026-11-21 ( see grafana: above ): up to 81Mi, 79Mi and 27Mi.
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi
kube-state-metrics:
  # Most Kubernetes alerts read its metrics, and it runs once: two replicas
  # would export every series twice and double the stack's sum() rules.
  # So it stays single, but never on kube-slave2 ( slow 2016 SD card ): on
  # 2026-11-23 that node couldn't start containers for 1.5 h, kube-state-
  # metrics with it, and the alerts that would have shown it went blind.
  # NodeCannotStartContainers ( node-runtime-rules.yaml ) reads kubelet
  # directly, so it doesn't depend on this pod.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [kube-slave2]
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 192Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
