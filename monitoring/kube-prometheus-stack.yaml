# Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics.
# The release was installed with the helm CLI in 2024 and is adopted as-is
# (same name and namespace), so Flux upgrades it in place.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  releaseName: grafana
  interval: 1h
  timeout: 20m  # Pis pulling new images over microSD are slow
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
    # No automatic rollback/uninstall: a failed upgrade stays failed and
    # alerts (Flux -> ntfy), instead of churning the stateful pieces.
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
