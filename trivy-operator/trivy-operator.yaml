# Trivy Operator: rescans every running image for vulnerabilities once a
# day. CI scans each of my images when it's built ( build-image.yml ), but
# an image that was clean two weeks ago can be affected by a CVE published
# since, and the charts' images ( Kong, Prometheus, Grafana, ... ) were
# never scanned here at all.
#
# Kept small for the Pis ( values.yaml ): vulnerabilities only, fixable
# HIGH and CRITICAL only, one scan at a time against one Trivy server that
# holds the database, and each report expires after 24 hours, which is
# what triggers the daily rescan. Results are VulnerabilityReports and
# Prometheus metrics ( alerts.yaml ).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aqua
  namespace: flux-system
spec:
  url: https://aquasecurity.github.io/helm-charts/
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  releaseName: trivy-operator
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: trivy-operator
      version: 0.38.1
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: trivy-operator-values
      valuesKey: values.yaml
  # The server downloads and unpacks the vulnerability database when it
  # starts, which takes a Pi longer than the chart's fixed liveness probe
  # allows ( ~100 s ): it was restarted mid-download, over and over. A
  # startup probe gives it 10 minutes before the liveness probe counts.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: trivy-server
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  httpGet:
                    path: /healthz
                    port: trivy-http
                  periodSeconds: 10
                  failureThreshold: 60
                  timeoutSeconds: 3
          # Where the server may run. Its database download and unpack
          # saturate a node's SD card: on 2026-11-22 that starved the
          # cluster's only CoreDNS on the same node, and DNS failed
          # cluster-wide for ~15 minutes. So: never with CoreDNS ( required
          # anti-affinity, which also keeps CoreDNS from moving next to it ),
          # not on kube-slave2 ( slow card ) or the master ( memory ).
          - target:
              kind: StatefulSet
              name: trivy-server
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values: [kube-master, kube-slave2]
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - topologyKey: kubernetes.io/hostname
                        namespaces: [kube-system]
                        labelSelector:
                          matchLabels:
                            k8s-app: kube-dns
