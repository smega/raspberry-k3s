# Kong (chart kong/ingress), the cluster's only way in: the VPS nginx sends
# every public site to port 80 on any of the 4 nodes (k3s_cluster upstream),
# and from there it goes to the kong-gateway pods.
#
# Installed by hand in 2026-04 with these values; Flux took it over on
# 2026-11-14 (kong.yaml). Changes since: 2 controllers with a PDB and a
# spread, and the gateway as a DaemonSet with externalTrafficPolicy: Local
# (see below), so no drain, reboot or crash takes the way in away.
controller:
  ingressController:
    enabled: true
  # Two controllers with leader election: a new gateway pod starts empty
  # and needs a controller to push the routes to it (that was the 404
  # after the master reboot on 2026-11-14).
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: kong
          app.kubernetes.io/name: controller
gateway:
  enabled: true
  # One gateway on every node, and each node's port 80 only goes to its own
  # (externalTrafficPolicy: Local below). With a Deployment and "Cluster",
  # the node the VPS connected to could forward to a gateway on a node that
  # had just died, and that request hung until k8s noticed (~60s; node-crash
  # game day 2026-11-14). Now a dead node is simply a dead upstream for the
  # VPS nginx, which moves on after 3s. Drains leave DaemonSet pods alone,
  # so a drained node keeps serving until it actually reboots.
  deployment:
    daemonset: true
  # ...except during maintenance: a node labelled smega.eu/maintenance loses
  # its gateway, so its NodePort stops answering and the VPS nginx moves on
  # after its 2s connect timeout, instead of waiting on a gateway that's
  # stuck behind an OS upgrade (trixie upgrade of kube-slave2, 2026-11-15:
  # 4 failed probes). os-upgrade/trixie-inplace.sh in the infra repo sets
  # and removes the label.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: smega.eu/maintenance
                operator: DoesNotExist
  admin:
    enabled: true
    type: ClusterIP
    http:
      enabled: false
      containerPort: 8001
      servicePort: 8001
    tls:
      enabled: true
      containerPort: 8444
      servicePort: 8444
  env:
    database: "off"
    # nginx starts one worker per core (4 on a Pi), each with its own Lua
    # VM and caches: ~300 MiB per gateway, on every node. The pod is capped
    # at 500m CPU anyway (it peaked at 0.46 at 1500 req/s, loadtest/), so
    # two workers lose nothing and save memory on all four Pis.
    nginx_worker_processes: "2"
  manager:
    enabled: false
  portal:
    enabled: false
  portalapi:
    enabled: false
  proxy:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local
    http:
      enabled: true
      containerPort: 8000
      servicePort: 80
      # Fixed: the VPS nginx connects here, not to :80. Port 80 goes through
      # k3s's svclb pod, and kube-proxy treats traffic from a pod as
      # in-cluster and spreads it over every node's gateway despite
      # externalTrafficPolicy Local, including a node that just died. Straight
      # to the NodePort, the VPS is an outside client and each node only
      # uses its own gateway (node-crash game day, 2026-11-15).
      nodePort: 30378
    tls:
      enabled: false
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
ingressController:
  installCRDs: false
