apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kong
  namespace: flux-system
spec:
  url: https://charts.konghq.com
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong
  namespace: kong
spec:
  # Same release name and namespace as the hand-made install, so
  # helm-controller upgrades that release in place instead of a new one.
  releaseName: kong
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ingress
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: kong
        namespace: flux-system
  install:
    crds: Skip
  upgrade:
    crds: Skip
    # Kong carries every public site: a failed upgrade goes back to the
    # last good release straight away instead of waiting for a human.
    remediation:
      retries: 1
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: kong-values
      valuesKey: values.yaml
