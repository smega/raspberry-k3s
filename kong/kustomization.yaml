# Kong Gateway, applied by Flux (clusters/home/kong.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kong.yaml
  - network-policies.yaml
  - metrics.yaml
configMapGenerator:
  - name: kong-values
    namespace: kong
    files:
      - values.yaml=kong-values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
