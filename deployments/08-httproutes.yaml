# status.smega.eu has no route here: Flagger owns that HTTPRoute (it
# shifts its backend weights during a release), see
# 14-status-web-canary.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-api
  namespace: public-demo
spec:
  parentRefs:
    - name: public-gateway
      namespace: kong
      sectionName: http
  hostnames:
    - api-status.smega.eu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: status-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: public-demo
spec:
  parentRefs:
    - name: public-gateway
      namespace: kong
      sectionName: http
  hostnames:
    - whoami.smega.eu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-dashboard
  namespace: public-dashboard
spec:
  parentRefs:
    - name: public-gateway
      namespace: kong
      sectionName: http
  hostnames:
    - cluster.smega.eu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard-web
          port: 80
