apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-web
  namespace: public-demo
spec:
  parentRefs:
    - name: public-gateway
      namespace: kong
      sectionName: http
  hostnames:
    - status.smega.eu
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: status-web
          port: 80
---
