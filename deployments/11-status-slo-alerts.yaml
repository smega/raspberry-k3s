# SLO alerting for the services on the status page.
#
# status-api exposes the checker's latest result per service as
# status_service_up (port 9100, in-cluster only). Prometheus scrapes it, and
# the rules below turn it into multi-window, multi-burn-rate alerts (Google
# SRE Workbook, ch. 5) against the same SLO the page shows: 99.5% over 30
# days, so the error budget is 0.5%.
#
#   burn rate  long window  short window  budget spent  severity
#   14.4x      1h           5m            2% in 1h      critical (page)
#   6x         6h           30m           5% in 6h      critical (page)
#   3x         1d           2h            10% in 1d     warning
#   1x         3d           6h            10% in 3d     warning
#
# The short window makes an alert resolve soon after the service recovers.
# The `release: grafana` labels are what kube-prometheus-stack's Prometheus
# selects on.
# A PodMonitor, not a ServiceMonitor: the Services are Flagger's
# ( 18-status-api-canary.yaml ), and this scrapes the live pods
# ( status-api-primary ) and, during a release, the candidate's.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: status-api
  namespace: public-demo
  labels:
    release: grafana
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [status-api, status-api-primary]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      # The metrics carry the checked service's name in `service`; without
      # this Prometheus overwrites it with the Kubernetes Service
      # ("status-api") and the original ends up in exported_service.
      honorLabels: true
    # Request durations with trace exemplars, as OpenMetrics
    # ( backend/requestmetrics.go ).
    - port: metrics
      path: /metrics/requests
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: status-slo
  namespace: public-demo
  labels:
    release: grafana
spec:
  groups:
    - name: status-slo.recording
      interval: 1m
      # The error ratios per window are Sloth's ( slo/status-checks.yaml ->
      # 21-slos.generated.yaml: slo:sli_error:ratio_rate<window> with
      # sloth_id="status-checks-availability" ). This one is the guard
      # Sloth can't express.
      rules:
        # Failed checks in the last hour. The checker runs every 5 minutes
        # and status_service_up holds each result until the next run, so a
        # 5-minute subquery step sees each check once.
        - record: status:failed_checks:1h
          expr: sum_over_time((max without (instance, pod) (status_service_up) == bool 0)[1h:5m])

    - name: status-slo.alerts
      rules:
        - alert: StatusSLOFastBurn
          expr: |
            # At least 2 failed checks: one failed check holds the gauge at 0
            # for 5 of 60 minutes, 8.3%, already over 14.4x the budget. On
            # 2026-11-24 a single 04:00 timeout ( the home connection's
            # nightly blip ) paged as critical.
            max without (sloth_id, sloth_service, sloth_slo, sloth_window) (
              (slo:sli_error:ratio_rate1h{sloth_id="status-checks-availability"} > (14.4 * 0.005)
                and on (service) slo:sli_error:ratio_rate5m{sloth_id="status-checks-availability"} > (14.4 * 0.005)
                and on (service) status:failed_checks:1h >= 2)
              or
              (slo:sli_error:ratio_rate6h{sloth_id="status-checks-availability"} > (6 * 0.005)
                and on (service) slo:sli_error:ratio_rate30m{sloth_id="status-checks-availability"} > (6 * 0.005))
            )
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/StatusSLOFastBurn.md
            summary: "{{ $labels.service }} is burning its error budget fast"
            description: >-
              {{ $labels.service }} is failing checks fast enough to use up a
              big part of its 30-day error budget (SLO 99.5%) within hours.
              Error ratio now: {{ $value | humanizePercentage }}.
              https://status.smega.eu

        - alert: StatusSLOSlowBurn
          expr: |
            max without (sloth_id, sloth_service, sloth_slo, sloth_window) (
              (slo:sli_error:ratio_rate1d{sloth_id="status-checks-availability"} > (3 * 0.005) and on (service) slo:sli_error:ratio_rate2h{sloth_id="status-checks-availability"} > (3 * 0.005))
              or
              (slo:sli_error:ratio_rate3d{sloth_id="status-checks-availability"} > 0.005 and on (service) slo:sli_error:ratio_rate6h{sloth_id="status-checks-availability"} > 0.005)
            )
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/StatusSLOSlowBurn.md
            summary: "{{ $labels.service }} is slowly eating its error budget"
            description: >-
              {{ $labels.service }} has been failing often enough over the last
              days to run out of its 30-day error budget (SLO 99.5%) before the
              window ends. Error ratio: {{ $value | humanizePercentage }}.
              https://status.smega.eu

        # If the checker stops, status_service_up freezes at its last value
        # and the burn-rate alerts go blind - so watch the watcher too.
        - alert: StatusCheckerStale
          expr: time() - max without (instance, pod) (status_data_generated_timestamp_seconds) > 15 * 60
          for: 5m
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/StatusCheckerStale.md
            summary: "The status checker has not run for {{ $value | humanizeDuration }}"
            description: >-
              The status-checker CronJob (every 5 minutes) has not written new
              results, so the status page and the SLO alerts show stale data.
              Check the CronJob and its last Job in public-demo.

        - alert: StatusMetricsMissing
          expr: absent(status_data_readable == 1)
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/StatusMetricsMissing.md
            summary: "No status metrics from status-api"
            description: >-
              Prometheus gets no readable status data from status-api
              (public-demo, port 9100), so the SLO alerts cannot fire.
