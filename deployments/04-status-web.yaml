apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-web
  namespace: public-demo
spec:
  # No replicas here: Flagger scales this Deployment (the release
  # candidate) to zero between releases and runs the live version as
  # status-web-primary; Flux setting a count would fight it. The HPA below
  # holds the count, and Flagger copies it for the primary.
  selector:
    matchLabels:
      app: status-web
  template:
    metadata:
      labels:
        app: status-web
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: status-web
      imagePullSecrets:
        - name: zot-registry
      # Step 1 of moving nginx off root: the port sysctl and seccomp now, so the
      # unprivileged image (uid 101, still on port 80) can start here; runAsNonRoot
      # and the rest follow once it is deployed.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.smdoes.eu/raspberry/status-web:main-1795082634-462e27f # {"$imagepolicy": "flux-system:status-web"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Runtime text (incident log) from content/ via Flux. A directory
          # mount, not subPath: only then does the kubelet update the files
          # in place when the ConfigMap changes.
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/content
              readOnly: true
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 96Mi
      volumes:
        - name: content
          configMap:
            name: status-content
---
# Two replicas on two Pis at all times (see the spread above), up to three
# under load. Flagger makes a status-web-primary copy of this HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: status-web
  namespace: public-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: status-web
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
# The Services (status-web, -primary, -canary) are Flagger's, from the
# Canary in 14-status-web-canary.yaml.
