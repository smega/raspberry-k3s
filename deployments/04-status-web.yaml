apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-web
  namespace: public-demo
spec:
  # No replicas here: Flagger scales this Deployment (the release
  # candidate) to zero between releases and runs the live version as
  # status-web-primary; Flux setting a count would fight it. The HPA below
  # holds the count, and Flagger copies it for the primary.
  selector:
    matchLabels:
      app: status-web
  template:
    metadata:
      labels:
        app: status-web
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: status-web
      imagePullSecrets:
        - name: zot-registry
      # No Kubernetes API calls from this pod, so no ServiceAccount token in it
      # (CIS 5.1.6).
      automountServiceAccountToken: false
      # Pod Security 'restricted' (00-namespaces.yaml): not root, no extra
      # capabilities, no privilege escalation, the runtime's seccomp profile.
      # nginx as its uid 101 (see the image's Dockerfile); it still listens on 80,
      # which the pod allows by lowering the unprivileged port range (a safe
      # sysctl). The root filesystem is read-only, /tmp (pid, temp files) an
      # emptyDir.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.smdoes.eu/raspberry/status-web:main-1795857607-4e80192 # {"$imagepolicy": "flux-system:status-web"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Runtime text (incident log) from content/ via Flux. A directory
          # mount, not subPath: only then does the kubelet update the files
          # in place when the ConfigMap changes.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: content
              mountPath: /usr/share/nginx/html/content
              readOnly: true
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # The CPU limit is what caps throughput (loadtest/, 2026-11-19:
          # throttled up to 82% at 1000 req/s with 150m while the nodes had
          # room), so 300m.
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 96Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: content
          configMap:
            name: status-content
---
# Two replicas on two Pis at all times (see the spread above), up to four
# (one per Pi) under load. Flagger makes a status-web-primary copy of this
# HPA. It only helps if load ramps up: a cold jump to 1200 req/s was over
# before the third pod started (loadtest/).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: status-web
  namespace: public-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: status-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
# The Services (status-web, -primary, -canary) are Flagger's, from the
# Canary in 14-status-web-canary.yaml.
