# TLS certificate expiry monitoring.
#
# The blackbox exporter (blackbox/blackbox-values.yaml) opens a TLS connection
# to each target and reports when its certificate expires. The rules alert
# 14 days ahead (warning) and 3 days ahead (critical), and when a handshake
# fails outright (an already expired or invalid certificate fails
# verification, and then no expiry date is reported at all).
#
# Added after a client certificate expired unnoticed (see the incident log on
# status.smega.eu). Probes for private hostnames live outside this repo.
#
# Game day 2026-11-19 (expired.badssl.com) changed two things:
# - an already expired certificate fails verification, so the verifying
#   probe reports no expiry date and only TLSProbeFailing could notice,
#   after hours. Every verifying probe now has an unverified twin
#   (tls-expiry-*), which still reports the date: CertificateExpiresVerySoon
#   fires for an expired one too (negative days);
# - one missed scrape emptied the expressions and restarted every `for`
#   (it happened twice in an hour: a blackbox exporter restart). The rules
#   now read the last value of the past 2 hours (two probe intervals),
#   per instance, so a gap doesn't reset them and the twins don't double.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tls-public-sites
  namespace: monitoring
  labels:
    release: grafana
spec:
  jobName: tls-public-sites
  interval: 1h
  module: tls_connect
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - smega.eu:443
        - status.smega.eu:443
        - api-status.smega.eu:443
        - cluster.smega.eu:443
        - whoami.smega.eu:443
        - tools.smega.eu:443
        - seo.smega.eu:443
        - yaots.smega.eu:443
        - runguard.smega.eu:443
        # Temporarily dropped (2026-11-17): nevnapok.eu has a domain issue,
        # would just fire noisy cert-expiry alerts. Re-add once fixed.
        # - nevnapok.eu:443
---
# The same targets without verification, for the expiry date (above).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tls-public-sites-expiry
  namespace: monitoring
  labels:
    release: grafana
spec:
  jobName: tls-expiry-public-sites
  interval: 1h
  module: tls_connect_insecure
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - smega.eu:443
        - status.smega.eu:443
        - api-status.smega.eu:443
        - cluster.smega.eu:443
        - whoami.smega.eu:443
        - tools.smega.eu:443
        - seo.smega.eu:443
        - yaots.smega.eu:443
        - runguard.smega.eu:443
---
# k3s signs its own certificates with a private CA, so these skip
# verification and only read the expiry. The API server's serving
# certificate is issued together with k3s's other component certificates,
# so it doubles as an early warning for those.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tls-k3s-apiserver
  namespace: monitoring
  labels:
    release: grafana
spec:
  jobName: tls-k3s
  interval: 1h
  module: tls_connect_insecure
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - kubernetes.default.svc:443
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-expiry
  namespace: monitoring
  labels:
    release: grafana
spec:
  groups:
    - name: cert-expiry
      rules:
        - alert: CertificateExpiresSoon
          expr: min by (instance) (last_over_time(probe_ssl_earliest_cert_expiry[2h]) - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/CertificateExpiresSoon.md
            summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | printf \"%.0f\" }} days"
            description: >-
              The certificate served at {{ $labels.instance }}
              expires in {{ $value | printf "%.1f" }} days and has not been
              renewed yet. Check the renewal (certbot timer, k3s rotation,
              Cloudflare).

        - alert: CertificateExpiresVerySoon
          expr: min by (instance) (last_over_time(probe_ssl_earliest_cert_expiry[2h]) - time()) / 86400 < 3
          for: 1h
          labels:
            severity: critical
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/CertificateExpiresVerySoon.md
            summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | printf \"%.1f\" }} days"
            description: >-
              The certificate served at {{ $labels.instance }}
              expires in {{ $value | printf "%.1f" }} days (negative: it
              already has). Renew it now.

        - alert: TLSProbeFailing
          # Verifying probes only: the tls-expiry-* twins succeed on an
          # invalid certificate by design.
          expr: max by (instance, job) (max_over_time(probe_success{job=~"tls-.*",job!~"tls-expiry-.*"}[2h])) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/TLSProbeFailing.md
            summary: "TLS handshake with {{ $labels.instance }} is failing"
            description: >-
              The blackbox exporter can't complete a TLS handshake with
              {{ $labels.instance }} ({{ $labels.job }}): every probe for about 2
              hours failed. An expired
              or invalid certificate looks like this, as does the host being
              down.
