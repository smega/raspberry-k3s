apiVersion: v1
kind: ConfigMap
metadata:
  name: status-data
  namespace: public-demo
  annotations:
    # Seed only: the status-checker CronJob owns this ConfigMap's data from
    # then on. Without this, every Flux sync would reset the history.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
data:
  status-data.json: |
    {
      "generatedAt": "2026-04-09T00:00:00Z",
      "services": []
    }
