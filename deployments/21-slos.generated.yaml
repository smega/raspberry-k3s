          - sum by (service) (increase(kong_request_latency_ms_bucket{service=~"httproute.public-demo.status-api.*", le="2000.0"}[3d]))
        )
        /
        (sum by (service) (increase(kong_request_latency_ms_count{service=~"httproute.public-demo.status-api.*"}[3d])))
      labels:
        sloth_id: traffic-latency-api
        sloth_service: traffic
        sloth_slo: latency-api
        sloth_window: 3d
      record: slo:sli_error:ratio_rate3d
    - expr: |
        sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="traffic-latency-api", sloth_service="traffic", sloth_slo="latency-api"}[30d])
        / ignoring (sloth_window)
        count_over_time(slo:sli_error:ratio_rate5m{sloth_id="traffic-latency-api", sloth_service="traffic", sloth_slo="latency-api"}[30d])
      labels:
        sloth_id: traffic-latency-api
        sloth_service: traffic
        sloth_slo: latency-api
        sloth_window: 30d
      record: slo:sli_error:ratio_rate30d
