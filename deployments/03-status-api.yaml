apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: public-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: status-api
      imagePullSecrets:
        - name: zot-registry
      containers:
        - name: api
          image: registry.smdoes.eu/raspberry/status-api:main-1794724339-8ad85fc # {"$imagepolicy": "flux-system:status-api"}
          imagePullPolicy: IfNotPresent
          env:
            - name: STATUS_DATA_FILE
              value: /data/status-data.json
            # Source for /api/nodes (live per-Pi temp/CPU/memory). Fixed
            # queries only, see backend/nodes.go.
            - name: PROMETHEUS_URL
              value: http://grafana-kube-prometheus-st-prometheus.monitoring.svc:9090
          ports:
            - name: http
              containerPort: 8080
            # /metrics for the SLO alerts; no HTTPRoute points here.
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: status-data
              mountPath: /data
              readOnly: true
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: status-data
          configMap:
            name: status-data
---
apiVersion: v1
kind: Service
metadata:
  name: status-api
  namespace: public-demo
  annotations:
    # A pod that's gone (drain, reboot) doesn't answer at all; give up on
    # it after 2s and let Kong retry the other replica (default: 60s).
    konghq.com/connect-timeout: "2000"
    # Same for a kept-alive connection to a pod that died under it (node
    # crash): no reply, no reset, so only a read timeout ends it. Answers
    # here are small and fast; after 5s Kong retries the other replica.
    konghq.com/read-timeout: "5000"
  labels:
    app: status-api
spec:
  selector:
    app: status-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9100
      targetPort: 9100
