apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: public-demo
spec:
  # No replicas here: Flagger runs the live version as status-api-primary
  # and scales this one ( the release candidate ) to zero between releases
  # ( 18-status-api-canary.yaml ). The HPA below holds the count.
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: status-api
      imagePullSecrets:
        - name: zot-registry
      # No Kubernetes API calls from this pod, so no ServiceAccount token in it
      # (CIS 5.1.6).
      automountServiceAccountToken: false
      # Pod Security 'restricted' (00-namespaces.yaml): not root, no extra
      # capabilities, no privilege escalation, the runtime's seccomp profile.
      # The image's user (appuser) by number, so the kubelet can check it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.smdoes.eu/raspberry/status-api:main-1795857503-6344243 # {"$imagepolicy": "flux-system:status-api"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          env:
            - name: STATUS_DATA_FILE
              value: /data/status-data.json
            # Traces to Alloy (observability/), see backend/tracing.go.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4318
            - name: OTEL_SERVICE_NAME
              value: status-api
            # Source for /api/nodes (live per-Pi temp/CPU/memory). Fixed
            # queries only, see backend/nodes.go.
            - name: PROMETHEUS_URL
              value: http://grafana-kube-prometheus-st-prometheus.monitoring.svc:9090
          ports:
            - name: http
              containerPort: 8080
            # /metrics for the SLO alerts; no HTTPRoute points here.
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: status-data
              mountPath: /data
              readOnly: true
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # The CPU limit is what capped /api/status (loadtest/, 2026-11-19:
          # ~100% throttled at 250m near 300 req/s, nodes at 52-81%), so 500m.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: status-data
          configMap:
            name: status-data
---
# Two replicas on two Pis at all times, a third under load. Flagger makes a
# status-api-primary copy of it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: status-api
  namespace: public-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: status-api
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
# The Services ( status-api, -primary, -canary ) are Flagger's, from the
# Canary in 18-status-api-canary.yaml; the Kong timeouts moved there.
