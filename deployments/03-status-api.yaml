apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: public-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
    spec:
      imagePullSecrets:
      - name: zot-registry
      containers:
        - name: api
          image: registry.smdoes.eu/raspberry/status-api:latest
          imagePullPolicy: Always
          env:
            - name: STATUS_DATA_FILE
              value: /data/status-data.json
            # Source for /api/nodes (live per-Pi temp/CPU/memory). Fixed
            # queries only, see backend/nodes.go.
            - name: PROMETHEUS_URL
              value: http://grafana-kube-prometheus-st-prometheus.monitoring.svc:9090
          ports:
            - name: http
              containerPort: 8080
            # /metrics for the SLO alerts; no HTTPRoute points here.
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: status-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: status-data
          configMap:
            name: status-data
---
apiVersion: v1
kind: Service
metadata:
  name: status-api
  namespace: public-demo
  labels:
    app: status-api
spec:
  selector:
    app: status-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9100
      targetPort: 9100
