apiVersion: v1
kind: ServiceAccount
metadata:
  name: status-checker-sa
  namespace: public-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: status-checker-role
  namespace: public-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: status-checker-binding
  namespace: public-demo
subjects:
  - kind: ServiceAccount
    name: status-checker-sa
    namespace: public-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: status-checker-role
