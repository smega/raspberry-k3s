apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: public-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: whoami
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: public-demo
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80