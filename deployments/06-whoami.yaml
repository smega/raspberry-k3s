apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: public-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. The PDB in 13-disruption-budgets.yaml
      # makes the drain wait for that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: whoami
      # No Kubernetes API calls from this pod, so no ServiceAccount token in it
      # (CIS 5.1.6).
      automountServiceAccountToken: false
      # Pod Security 'restricted' (00-namespaces.yaml): not root, no extra
      # capabilities, no privilege escalation, the runtime's seccomp profile.
      # The image runs as root by default; as nobody it still binds port 80,
      # because the pod lowers the unprivileged port range (a safe sysctl).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 80
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: public-demo
  annotations:
    # A pod that's gone (drain, reboot) doesn't answer at all; give up on
    # it after 2s and let Kong retry the other replica (default: 60s).
    konghq.com/connect-timeout: "2000"
    # Same for a kept-alive connection to a pod that died under it (node
    # crash): no reply, no reset, so only a read timeout ends it. Answers
    # here are small and fast; after 5s Kong retries the other replica.
    konghq.com/read-timeout: "5000"
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80