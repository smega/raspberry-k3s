apiVersion: batch/v1
kind: CronJob
metadata:
  name: status-checker
  namespace: public-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: zot-registry
          serviceAccountName: status-checker-sa
          restartPolicy: OnFailure
          containers:
            - name: checker
              image: registry.smdoes.eu/raspberry/status-checker:latest
              imagePullPolicy: Always
              env:
                - name: STATUS_NAMESPACE
                  value: public-demo
                - name: STATUS_CONFIGMAP_NAME
                  value: status-data
              resources:
                requests:
                  cpu: 20m
                  memory: 48Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
