apiVersion: batch/v1
kind: CronJob
metadata:
  name: status-checker
  namespace: public-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: zot-registry
          serviceAccountName: status-checker-sa
          restartPolicy: OnFailure
          containers:
          - name: checker
            image: registry.smdoes.eu/raspberry/status-checker:main-1794757058-e7bfbdd # {"$imagepolicy": "flux-system:status-checker"}
            imagePullPolicy: IfNotPresent
            env:
            - name: STATUS_NAMESPACE
              value: public-demo
            - name: STATUS_CONFIGMAP_NAME
              value: status-data
            # Temporary override (2026-11-17): drops "Nevnap API" from the
            # default target list while nevnapok.eu has a domain issue.
            # Revert by deleting this env var once the domain is fixed.
            - name: STATUS_TARGETS_JSON
              value: >-
                {"Personal site": "https://smega.eu", "Cluster dashboard": "https://cluster.smega.eu",
                "Whoami demo": "https://whoami.smega.eu", "Developer tools": "https://tools.smega.eu",
                "SEO Checker": "https://seo.smega.eu", "One-time Secret": "https://yaots.smega.eu",
                "RunGuard": "https://runguard.smega.eu"}
            # Public RunGuard pages of the VPS-side watchers; Secret made by
            # hand (not in this public repo), optional so the checker still
            # runs without it.
            - name: RUNGUARD_EXTERNAL_PROBE_URL
              valueFrom:
                secretKeyRef: {name: runguard-public-jobs, key: external-probe, optional: true}
            - name: RUNGUARD_RESTORE_TEST_URL
              valueFrom:
                secretKeyRef: {name: runguard-public-jobs, key: restore-test, optional: true}
            resources:
              requests:
                cpu: 20m
                memory: 48Mi
              limits:
                cpu: 100m
                memory: 96Mi
