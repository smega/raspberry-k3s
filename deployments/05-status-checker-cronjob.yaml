apiVersion: batch/v1
kind: CronJob
metadata:
  name: status-checker
  namespace: public-demo
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: zot-registry
          serviceAccountName: status-checker-sa
          restartPolicy: OnFailure
          containers:
          - name: checker
            image: registry.smdoes.eu/raspberry/status-checker:main-1794732195-81c83e0 # {"$imagepolicy": "flux-system:status-checker"}
            imagePullPolicy: IfNotPresent
            env:
            - name: STATUS_NAMESPACE
              value: public-demo
            - name: STATUS_CONFIGMAP_NAME
              value: status-data
            # Public RunGuard pages of the VPS-side watchers; Secret made by
            # hand (not in this public repo), optional so the checker still
            # runs without it.
            - name: RUNGUARD_EXTERNAL_PROBE_URL
              valueFrom:
                secretKeyRef: {name: runguard-public-jobs, key: external-probe, optional: true}
            - name: RUNGUARD_RESTORE_TEST_URL
              valueFrom:
                secretKeyRef: {name: runguard-public-jobs, key: restore-test, optional: true}
            resources:
              requests:
                cpu: 20m
                memory: 48Mi
              limits:
                cpu: 100m
                memory: 96Mi
