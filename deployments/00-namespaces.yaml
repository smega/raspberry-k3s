apiVersion: v1
kind: Namespace
metadata:
  name: public-dashboard
  labels:
    expose-via-public-gateway: "true"
    # Image signatures checked by the policy-controller (image-policies/).
    policy.sigstore.dev/include: "true"
    # Pod Security Admission: pods that run as root, add capabilities,
    # mount host paths or skip seccomp are refused here.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
