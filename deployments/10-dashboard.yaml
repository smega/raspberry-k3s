apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: public-dashboard
data:
  config.yml: |
    server:
      address: ":8080"
      allowed_origins:
      - "https://cluster.smega.eu"
    mongo:
      database: "dashboard"
    auth:
      token_ttl_minutes: 60
      bcrypt_cost: 12
    kube:
      kubeconfig: ""
    # Overview sparklines (query_range), see kube_metrics_history.go.
    prometheus:
      url: "http://grafana-kube-prometheus-st-prometheus.monitoring.svc:9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: public-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving. Safe since the sparkline history moved
      # from pod memory to Prometheus.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: dashboard-backend
      serviceAccountName: public-dashboard-sa
      imagePullSecrets:
        - name: zot-registry
      # Pod Security 'restricted' (00-namespaces.yaml): not root, no extra
      # capabilities, no privilege escalation, the runtime's seccomp profile.
      # distroless runs as root by default; 65532 is its nonroot user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.smdoes.eu/raspberry/dashboard-backend:main-1794725977-1e703d7 # {"$imagepolicy": "flux-system:dashboard-backend"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: mongo_uri
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: jwt_secret
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 30m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: dashboard-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: public-dashboard
  annotations:
    # A pod that's gone (drain, reboot) doesn't answer at all; give up on
    # it after 2s and let Kong retry the other replica (default: 60s).
    konghq.com/connect-timeout: "2000"
spec:
  selector:
    app: dashboard-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-web
  namespace: public-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-web
  template:
    metadata:
      labels:
        app: dashboard-web
    spec:
      # Two replicas on two different Pis, so a drain or a reboot (kured)
      # always leaves one serving.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: dashboard-web
      imagePullSecrets:
        - name: zot-registry
      # Step 1 of moving nginx off root: the port sysctl and seccomp now, so the
      # unprivileged image (uid 101, still on port 80) can start here; runAsNonRoot
      # and the rest follow once it is deployed.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.smdoes.eu/raspberry/dashboard-web:main-1795097547-c4b7435 # {"$imagepolicy": "flux-system:dashboard-web"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Keep serving for 10s after SIGTERM: Kong only drops this pod
          # from its upstream once the controller has seen the endpoint go,
          # and until then it still sends requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-web
  namespace: public-dashboard
  annotations:
    # A pod that's gone (drain, reboot) doesn't answer at all; give up on
    # it after 2s and let Kong retry the other replica (default: 60s).
    konghq.com/connect-timeout: "2000"
    # No read-timeout here (the other public services have 5s): the
    # backend's SSE streams (/api/*/stream) go through this Service too,
    # via dashboard-web's nginx, and must stay open.
spec:
  selector:
    app: dashboard-web
  ports:
    - port: 80
      targetPort: 80
