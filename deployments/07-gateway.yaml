# The `kong` namespace itself comes from installing the Kong Gateway API
# implementation (Flux: kong/kong.yaml), or by hand:
#   helm install kong kong/ingress --version 0.24.0 -n kong --create-namespace -f kong/kong-values.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              expose-via-public-gateway: "true"
