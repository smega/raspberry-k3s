# Loki, one process (SingleBinary), chunks and index on a local volume.
# Logs only, kept 3 days: enough to go from an alert to what the pods
# said around it, small enough for a Pi's SD card.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      # Well before the first log line: Alloy sends each pod's whole log
      # on its first read, lines from before the install day included.
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    # The trace id a log line carries (status-api, the checker) is kept
    # as structured metadata, not a label: one value per request.
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  # The ruler runs inside the one process, with its rules from the
  # loki-rules ConfigMap ( loki-rules.yaml, mounted below ) and alerts
  # going to the same Alertmanager as Prometheus'.
  rulerConfig:
    enable_api: false
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /var/loki/ruler-scratch
    alertmanager_url: http://grafana-kube-prometheus-st-alertmanager.monitoring.svc:9093
    wal:
      dir: /var/loki/ruler-wal
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  # Not kube-master (Prometheus, memory) or kube-slave2 (slow SD card).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [kube-slave1, kube-slave3]
  # The rules, as tenant "fake" ( what Loki calls everything when auth
  # is off ).
  extraVolumes:
    - name: rules
      configMap:
        name: loki-rules
  extraVolumeMounts:
    - name: rules
      mountPath: /etc/loki/rules/fake
      readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
# The scalable modes' parts, caches and helpers: off.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
# The rules are one ConfigMap mounted as a volume: no sidecar watching
# ConfigMaps for them.
sidecar:
  rules:
    enabled: false
