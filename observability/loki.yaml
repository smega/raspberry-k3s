# Logs: Loki, one process, 3 days. Values in loki-values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1h
  timeout: 15m  # Pis pulling new images over microSD are slow
  chart:
    spec:
      chart: loki
      version: 7.6.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
