# Alerts from logs: what has no metric. Loki's ruler ( in the one Loki
# process, loki-values.yaml ) evaluates these LogQL rules every minute
# and sends to the same Alertmanager as Prometheus, so they reach the
# phone the same way, diagnostics included.
#
# Calibrated on the 3 days of logs Loki keeps ( 2026-11-20..23 ):
#   - panics: none, anywhere. Any one is worth a look.
#   - tracebacks in our own Python ( status checker, pi-temp-led ): only
#     pi-temp-led's shutdown noise, fixed the same day.
#   - connection errors in the public apps: the 2026-11-22 dashboard
#     outage logged 56-66 per 15 minutes per pod for four hours; the
#     busiest normal 15 minutes had 14.
# Not here: DNS. The 11-22 DNS outage left only two minutes of log lines
# ( most apps don't log a failed lookup ), the same as a harmless 30 s
# upstream blip at 04:00; the blackbox DNS probe covers it with metrics.
#
# Loki's own query logs are left out: they quote the patterns.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: observability
data:
  rules.yaml: |
    groups:
      - name: log-alerts
        interval: 1m
        rules:
          - alert: LogPanic
            expr: >-
              sum by (namespace, pod) (count_over_time(
                {namespace=~".+", container!="loki"} |~ `^(panic: |fatal error: )` [10m]
              )) > 0
            labels:
              severity: warning
              source: loki
            annotations:
              runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/LogPanic.md
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} panicked"
              description: >-
                A Go program in {{ $labels.pod }} logged a panic or a fatal
                error in the last 10 minutes. It probably restarted; the stack
                is in Loki: {namespace="{{ $labels.namespace }}", pod="{{ $labels.pod }}"} |= "panic".
          - alert: LogTraceback
            expr: >-
              sum by (namespace, pod) (count_over_time(
                {namespace=~"public-demo|public-dashboard|cpu-led"} |= `Traceback (most recent call last)` [10m]
              )) > 0
            labels:
              severity: warning
              source: loki
            annotations:
              runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/LogPanic.md
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} logged a Python traceback"
              description: >-
                Our own Python code ( the status checker, pi-temp-led ) raised
                an exception that reached the log in the last 10 minutes.
          - alert: LogConnectionErrors
            expr: >-
              sum by (namespace, pod) (count_over_time(
                {namespace=~"public-demo|public-dashboard"} |~ `(?i)connection refused|ECONNREFUSED|i/o timeout|ETIMEDOUT|context deadline exceeded` [15m]
              )) > 20
            for: 15m
            labels:
              severity: warning
              source: loki
            annotations:
              runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/LogConnectionErrors.md
              summary: "{{ $labels.namespace }}/{{ $labels.pod }}: {{ $value }} connection errors in 15 minutes"
              description: >-
                {{ $labels.pod }} keeps failing to reach something: over 20
                refused or timed-out connections per 15 minutes, for 15 minutes.
                The page may still answer while what it depends on doesn't
                ( on 2026-11-22 the dashboard did, for four hours ).
