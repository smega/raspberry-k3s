apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubereboot
  namespace: flux-system
spec:
  url: https://kubereboot.github.io/charts
  interval: 12h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: kube-system
spec:
  releaseName: kured
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kured
      version: 6.1.0
      sourceRef:
        kind: HelmRepository
        name: kubereboot
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: kured-values
      valuesKey: values.yaml
