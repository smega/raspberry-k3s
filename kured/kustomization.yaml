# kured (automatic node reboots), applied by Flux (clusters/home/kured.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kured.yaml
configMapGenerator:
  - name: kured-values
    namespace: kube-system
    files:
      - values.yaml=kured-values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
