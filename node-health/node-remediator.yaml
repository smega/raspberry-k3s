# node-remediator ( ../node-remediator/ ): cordons and drains a worker
# whose SDCardSlow condition is True, uncordons it after 15 minutes of
# health. The rules are in its main.go and decide.go: one node at a time,
# never the control plane, never with fewer than two healthy workers left,
# pods whose volume is on that node stay, PodDisruptionBudgets are honoured.
# A node annotated smega.eu/auto-remediation=off is left alone.
#
# It runs on kube-master, the one node it never drains, so it isn't
# evicting itself halfway. In the monitoring namespace for the registry
# Secret and the scrape that are already there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-remediator
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-remediator
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, persistentvolumes]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-remediator
subjects:
  - kind: ServiceAccount
    name: node-remediator
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-remediator
  namespace: monitoring
spec:
  # One: two would race for the same cordon.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-remediator
  template:
    metadata:
      labels:
        app: node-remediator
    spec:
      serviceAccountName: node-remediator
      imagePullSecrets:
        - name: zot-registry
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: remediator
          image: registry.smdoes.eu/raspberry/node-remediator:main-1795811641-4738875 # {"$imagepolicy": "flux-system:node-remediator"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: CONDITIONS
              value: SDCardSlow
            - name: DRY_RUN
              value: "0"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 48Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: node-remediator
  namespace: monitoring
  labels:
    release: grafana
spec:
  selector:
    matchLabels:
      app: node-remediator
  podMetricsEndpoints:
    - port: metrics
      interval: 1m
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-remediation
  namespace: monitoring
  labels:
    release: grafana
spec:
  groups:
    - name: node-remediation
      rules:
        # Not inhibited by NodeMaintenance ( it isn't in that list ): the
        # one message that says a machine did this, and why.
        - alert: NodeAutoCordoned
          expr: max by (node) (node_remediator_cordoned) == 1
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/NodeAutoCordoned.md
            summary: "{{ $labels.node }} was cordoned and drained automatically: its SD card is slow"
            description: >-
              Node Problem Detector set SDCardSlow on {{ $labels.node }} and
              node-remediator moved its pods away. Pods whose volume is on
              that node are still there. It uncordons by itself after 15
              healthy minutes; a card that stays slow needs replacing.
        - alert: NodeProblemNotRemediated
          expr: >-
            max by (node) (kube_node_status_condition{condition="SDCardSlow",status="true"}) == 1
            unless on (node) max by (node) (node_remediator_cordoned) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/NodeAutoCordoned.md
            summary: "{{ $labels.node }}'s SD card is slow and nothing moved its pods"
            description: >-
              SDCardSlow has been True on {{ $labels.node }} for 30 minutes
              and node-remediator left it alone: the control plane, another
              node already cordoned, too few healthy workers, the cooldown
              after an automatic uncordon, or opted out
              ( node_remediator_blocked has the reason ).
        - alert: NodeDrainStuck
          expr: max by (node) (node_remediator_pods_left) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/NodeAutoCordoned.md
            summary: "{{ $value }} pods still on {{ $labels.node }} 30 minutes after it was cordoned"
            description: >-
              node-remediator keeps trying to evict them; a
              PodDisruptionBudget refuses ( no healthy replica elsewhere ),
              or the eviction fails.
        - alert: NodeRemediatorDown
          expr: >-
            (time() - max(node_remediator_last_run_timestamp_seconds) > 600)
            or (max(node_remediator_last_run_success) == 0)
            or absent(node_remediator_last_run_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            runbook_url: https://github.com/smega/raspberry-k3s/blob/main/runbooks/NodeAutoCordoned.md
            summary: "node-remediator isn't working: a sick node would stay in service"
            description: >-
              No successful round for 15 minutes, or no metrics at all.
              kubectl -n monitoring logs deploy/node-remediator
